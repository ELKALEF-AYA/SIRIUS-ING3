services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: jsa
      POSTGRES_PASSWORD: aya
      POSTGRES_DB: jsa_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsa -d jsa_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - db-net

volumes:
  postgres-data:

networks:
  db-net:
    driver: bridge
