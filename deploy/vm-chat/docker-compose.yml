services:

  chat-service:
    image: sirius/chat-service:latest
    container_name: chat-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.31.249.236:5432/jsa_db
      SPRING_DATASOURCE_USERNAME: jsa
      SPRING_DATASOURCE_PASSWORD: aya
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      APP_JWT_SECRET: ${JWT_SECRET}
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
      LOGGING_LEVEL_COM_APP_CHAT: INFO
    networks:
      - chat-net

networks:
  chat-net:
    driver: bridge
