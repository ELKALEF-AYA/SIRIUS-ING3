version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: always
    ports:
      - "80:80"      # Trafic HTTP pour front + back
      - "8080:8080"  # Dashboard Traefik (optionnel)
    volumes:
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro"
    networks:
      - webnet

  frontend:
    build: /opt/front       # Dockerfile + dist dans /opt/front
    container_name: frontend
    restart: always
    networks:
      - webnet

networks:
  webnet: