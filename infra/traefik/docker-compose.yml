version: "3.8"

services:

  traefik:
    image: traefik:v2.10
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8888:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    networks:
      - webnet

  frontend:
    image: sirius/frontend:latest
    container_name: frontend
    restart: unless-stopped
    networks:
      - webnet

  bff-service:
    image: sirius/bff-service:latest
    container_name: bff-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVICES_AUTHBASEURL: http://172.31.253.250:8081
      SERVICES_CHATBASEURL: http://172.31.249.138:8085
      SERVICES_NOTIFICATIONBASEURL: http://172.31.249.138:8083
      SERVICES_RENTRECEIPTBASEURL: http://172.31.249.10:8084
      LOGGING_LEVEL_ROOT: INFO
    networks:
      - webnet

networks:
  webnet:
    driver: bridge